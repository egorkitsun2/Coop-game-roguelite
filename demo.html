<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2D Top-Down Player Controller Demo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: radial-gradient(circle at center, #1a202c, #0d1117);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #f7fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    #game-wrapper {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 0 2px rgba(255, 255, 255, 0.08);
      background: #0f141c;
    }
    canvas {
      display: block;
      background-color: #141a23;
    }
    .hud {
      position: absolute;
      top: 16px;
      left: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }
    .bar-container {
      background: rgba(15, 20, 28, 0.75);
      backdrop-filter: blur(8px);
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .bar-label {
      font-size: 13px;
      font-weight: 700;
      width: 70px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .bar-track {
      width: 180px;
      height: 12px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      overflow: hidden;
      position: relative;
    }
    .bar-fill {
      height: 100%;
      width: 100%;
      border-radius: 6px;
      transition: width 0.05s linear;
    }
    #hp-fill {
      background: linear-gradient(90deg, #e53e3e, #f56565);
      box-shadow: 0 0 8px rgba(229, 62, 62, 0.6);
    }
    #dash-fill {
      background: linear-gradient(90deg, #3182ce, #63b3ed);
      box-shadow: 0 0 8px rgba(99, 179, 237, 0.6);
    }
    .bar-text {
      font-size: 12px;
      font-weight: 600;
      min-width: 45px;
      text-align: right;
      color: #e2e8f0;
      font-variant-numeric: tabular-nums;
    }
    .controls-hint {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 20, 28, 0.8);
      backdrop-filter: blur(8px);
      padding: 8px 20px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 13px;
      color: #a0aec0;
      pointer-events: none;
      white-space: nowrap;
    }
    kbd {
      background: #2d3748;
      color: #edf2f7;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
      font-family: inherit;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>

  <div id="game-wrapper">
    <!-- Игровой холст -->
    <canvas id="gameCanvas" width="960" height="540"></canvas>

    <!-- Игровой интерфейс (HUD) -->
    <div class="hud">
      <div class="bar-container">
        <span class="bar-label" style="color: #fc8181;">HP</span>
        <div class="bar-track">
          <div id="hp-fill" class="bar-fill" style="width: 100%;"></div>
        </div>
        <span id="hp-value" class="bar-text">100 / 100</span>
      </div>

      <div class="bar-container">
        <span class="bar-label" style="color: #90cdf4;">Dash</span>
        <div class="bar-track">
          <div id="dash-fill" class="bar-fill" style="width: 100%;"></div>
        </div>
        <span id="dash-value" class="bar-text">READY</span>
      </div>
    </div>

    <!-- Подсказка по управлению -->
    <div class="controls-hint">
      Движение: <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> &nbsp;|&nbsp; 
      Рывок: <kbd>Space</kbd> &nbsp;|&nbsp; 
      Оружие: <kbd>1</kbd> Рогатка / <kbd>2</kbd> Палка &nbsp;|&nbsp; 
      Действие: <kbd>ПКМ</kbd> (Натянуть / Блок) &nbsp;|&nbsp;
      Враг: <kbd>C</kbd> Призвать гусеницу
    </div>
  </div>

  <script>
    // ==========================================
    // 1. КОНФИГУРАЦИЯ И СТРУКТУРЫ ДАННЫХ
    // ==========================================
    const WEAPONS = {
      SLINGSHOT: 0, // Рогатка (Дальний бой)
      STICK: 1,     // Палка (Ближний бой)
    };

    const CONFIG = {
      player: {
        radius: 18,
        baseSpeed: 240,            // пикселей в секунду
        dashSpeed: 820,            // пикселей в секунду во время рывка
        dashDuration: 0.18,        // длительность рывка в секундах (~180 мс)
        dashCooldown: 2.5,         // кулдаун рывка в секундах
        maxHp: 100,
        baseDamage: 5,             // базовый урон
        maxChargeTime: 1.5,        // время полного натяжения рогатки (сек)
        minDmgMult: 1.0,           // мин. множитель урона
        maxDmgMult: 2.5,           // макс. множитель урона при полном натяжении
        projectileSpeed: 650,      // скорость полета камня
      },
      arena: {
        gridSize: 40,
        gridColor: '#1a2230',
      }
    };

    // ==========================================
    // КЛАСС СНАРЯДА (КАМЕНЬ ДЛЯ РОГАТКИ)
    // ==========================================
    class Projectile {
      constructor(x, y, targetX, targetY, speed, damage) {
        this.x = x;
        this.y = y;
        this.damage = damage;
        this.radius = 5;
        this.lifeTime = 2.0; // снаряд исчезает через 2 сек
        this.isDead = false;

        // Вектор направления к цели на момент выстрела
        const dx = targetX - x;
        const dy = targetY - y;
        const len = Math.hypot(dx, dy) || 1;

        this.vx = (dx / len) * speed;
        this.vy = (dy / len) * speed;
      }

      update(dt, arenaBounds) {
        this.x += this.vx * dt;
        this.y += this.vy * dt;

        this.lifeTime -= dt;
        if (
          this.lifeTime <= 0 ||
          this.x < 0 || this.x > arenaBounds.width ||
          this.y < 0 || this.y > arenaBounds.height
        ) {
          this.isDead = true;
        }
      }

      draw(ctx) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#ecc94b';
        ctx.shadowColor = '#d69e2e';
        ctx.shadowBlur = 8;
        ctx.fill();
        ctx.restore();
      }
    }

    // ==========================================
    // КЛАСС РАЗРУШАЕМОГО ОБЪЕКТА (ЯЩИК)
    // ==========================================
    class Crate {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.radius = 16;
        this.isDead = false;
      }

      draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.fillStyle = '#8b5a2b';
        ctx.strokeStyle = '#5c3a1e';
        ctx.lineWidth = 2;
        ctx.fillRect(-14, -14, 28, 28);
        ctx.strokeRect(-14, -14, 28, 28);

        // Крест на ящике
        ctx.beginPath();
        ctx.moveTo(-14, -14); ctx.lineTo(14, 14);
        ctx.moveTo(14, -14); ctx.lineTo(-14, 14);
        ctx.strokeStyle = '#5c3a1e';
        ctx.stroke();
        ctx.restore();
      }
    }

    // ==========================================
    // КЛАСС ПРЕДМЕТА (ЗЕЛЬЕ ЛЕЧЕНИЯ)
    // ==========================================
    class Potion {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.radius = 12;
        this.isDead = false;
        this.bobble = 0; // плавная анимация левитации
      }

      update(dt) {
        this.bobble += dt * 4;
      }

      draw(ctx) {
        const offsetY = Math.sin(this.bobble) * 3;
        ctx.save();
        ctx.translate(this.x, this.y + offsetY);

        // Свечение зелья
        ctx.shadowColor = '#e53e3e';
        ctx.shadowBlur = 12;

        // Колба зелья
        ctx.beginPath();
        ctx.arc(0, 2, 8, 0, Math.PI * 2);
        ctx.fillStyle = '#e53e3e';
        ctx.fill();

        // Горлышко
        ctx.fillStyle = '#cbd5e0';
        ctx.fillRect(-3, -8, 6, 4);

        ctx.restore();
      }
    }

    // ==========================================
    // КЛАСС ВРАГА: ГУСЕНИЦА (CATERPILLAR ENEMY)
    // ==========================================
    class CaterpillarEnemy {
      constructor(x, y, spriteImg) {
        this.x = x;
        this.y = y;
        this.radius = 24;
        this.speed = 65;
        this.hp = 5;
        this.isDead = false;
        this.hitFlashTimer = 0;
        this.spriteImg = spriteImg;

        // Анимация спрайта (сетка 7 колонок x 4 строки, размер ячейки 160x160)
        this.frameTimer = 0;
        this.currentFrame = 0;
        this.totalFrames = 7;
        this.fps = 9;
        this.directionRow = 0; // 0: Вниз, 1: Вверх, 2: Влево, 3: Вправо
      }

      update(dt, playerPos) {
        if (this.isDead) return;

        if (this.hitFlashTimer > 0) {
          this.hitFlashTimer -= dt;
        }

        // Преследование игрока
        const dx = playerPos.x - this.x;
        const dy = playerPos.y - this.y;
        const dist = Math.hypot(dx, dy);

        if (dist > 6) {
          const vx = (dx / dist) * this.speed;
          const vy = (dy / dist) * this.speed;
          this.x += vx * dt;
          this.y += vy * dt;

          // Определение анимационной строки по направлению
          if (Math.abs(dx) > Math.abs(dy)) {
            this.directionRow = dx > 0 ? 3 : 2; // Вправо (3) : Влево (2)
          } else {
            this.directionRow = dy > 0 ? 0 : 1; // Вниз (0) : Вверх (1)
          }

          // Цикл анимации ползания
          this.frameTimer += dt * this.fps;
          this.currentFrame = Math.floor(this.frameTimer) % this.totalFrames;
        }
      }

      takeDamage(amount) {
        this.hp -= amount;
        this.hitFlashTimer = 0.15;
        if (this.hp <= 0) {
          this.isDead = true;
        }
      }

      draw(ctx) {
        if (this.isDead) return;

        ctx.save();
        ctx.translate(this.x, this.y);

        // Тень гусеницы
        ctx.beginPath();
        ctx.ellipse(0, 16, 20, 8, 0, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
        ctx.fill();

        if (this.spriteImg && this.spriteImg.complete && this.spriteImg.naturalWidth > 0) {
          const frameW = 160;
          const frameH = 160;
          const sx = this.currentFrame * frameW;
          const sy = this.directionRow * frameH;
          const renderSize = 72; // Размер отрисовки на экране

          if (this.hitFlashTimer > 0) {
            ctx.filter = 'brightness(2) drop-shadow(0 0 8px #ff4444)';
          }

          ctx.drawImage(
            this.spriteImg,
            sx, sy, frameW, frameH,
            -renderSize / 2, -renderSize / 2, renderSize, renderSize
          );
        } else {
          // Фолбэк, если спрайт загружается
          ctx.beginPath();
          ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
          ctx.fillStyle = this.hitFlashTimer > 0 ? '#ff6666' : '#48bb78';
          ctx.fill();
        }

        ctx.restore();
      }
    }

    // ==========================================
    // 2. ИГРОВОЙ КОНТРОЛЛЕР ИГРОКА (PLAYER CONTROLLER)
    // ==========================================
    class PlayerController {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.rotation = 0; // направление прицеливания (к курсору мыши)

        // Характеристики
        this.maxHp = CONFIG.player.maxHp;
        this.hp = 50; // для демонстрации лечения начинаем с 50/100
        this.baseSpeed = CONFIG.player.baseSpeed;
        this.baseDamage = CONFIG.player.baseDamage; // 5

        // Эффект регенерации от зелья
        this.regenDuration = 0;   // остаток длительности регенерации (10 сек)
        this.regenTickTimer = 0;  // таймер тика (+1 HP каждую секунду)

        // Оружие: 0 — Рогатка, 1 — Палка
        this.currentWeapon = WEAPONS.SLINGSHOT;

        // Состояния оружия
        this.chargeTime = 0;      // текущее время натяжения рогатки (сек)
        this.isBlocking = false;  // состояние блока палкой

        // Векторы движения
        this.moveDir = { x: 0, y: 0 };
        this.facingDir = { x: 1, y: 0 };

        // Состояние рывка (Dash)
        this.isDashing = false;
        this.dashDurationTimer = 0;
        this.dashCooldownTimer = 0;
        this.dashVelocity = { x: 0, y: 0 };

        // Шлейф
        this.trail = [];
      }

      /**
       * Функция лечения персонажа с ограничением капа в 100 HP
       */
      heal(amount) {
        this.hp = Math.min(this.maxHp, this.hp + amount);
      }

      /**
       * Эффект подбора зелья:
       * 1. Мгновенно +20 HP (не более 100 HP)
       * 2. Запуск/сброс таймера регенерации на ровно 10 секунд (+1 HP/сек)
       */
      applyPotion() {
        // Мгновенный хил
        this.heal(20);

        // Сброс таймера регенерации ровно на 10 секунд
        this.regenDuration = 10.0;
        this.regenTickTimer = 1.0; // первый тик через 1 секунду
      }

      /**
       * Обновление состояния игрока в игровом цикле
       */
      update(dt, input, projectiles, arenaBounds) {
        // 1. Прицеливание: поворот всегда смотрит строго на курсор мыши
        const dx = input.mouse.x - this.x;
        const dy = input.mouse.y - this.y;
        this.rotation = Math.atan2(dy, dx);

        // 2. Смена оружия (клавиши 1 и 2)
        if (input.keys.has('Digit1')) this.switchWeapon(WEAPONS.SLINGSHOT);
        if (input.keys.has('Digit2')) this.switchWeapon(WEAPONS.STICK);

        // 3. Обновление кулдауна рывка (не блокирует цикл)
        if (this.dashCooldownTimer > 0) {
          this.dashCooldownTimer = Math.max(0, this.dashCooldownTimer - dt);
        }

        // 4. Логика эффекта регенерации от зелья (+1 HP каждую секунду, ровно 10 сек)
        if (this.regenDuration > 0) {
          this.regenDuration = Math.max(0, this.regenDuration - dt);
          this.regenTickTimer -= dt;

          if (this.regenTickTimer <= 0) {
            this.heal(1);
            this.regenTickTimer += 1.0; // следующий тик через 1 сек
          }
        }

        // 5. Логика оружия по ПКМ (RMB)
        this.updateWeapon(dt, input, projectiles);

        // 6. Ввод движения (WASD)
        this.processMovementInput(input);

        // 7. Рывок
        if (input.dashRequested && this.canDash()) {
          this.startDash();
        }

        // 8. Перемещение (во время блока скорость снижается на 50%)
        const speedModifier = this.isBlocking ? 0.5 : 1.0;
        if (this.isDashing) {
          this.x += this.dashVelocity.x * dt;
          this.y += this.dashVelocity.y * dt;
          this.dashDurationTimer -= dt;
          if (this.dashDurationTimer <= 0) this.isDashing = false;
          this.trail.push({ x: this.x, y: this.y, alpha: 0.6, radius: CONFIG.player.radius });
        } else {
          this.x += this.moveDir.x * (this.baseSpeed * speedModifier) * dt;
          this.y += this.moveDir.y * (this.baseSpeed * speedModifier) * dt;
        }

        // Границы арены
        const r = CONFIG.player.radius;
        this.x = Math.max(r, Math.min(arenaBounds.width - r, this.x));
        this.y = Math.max(r, Math.min(arenaBounds.height - r, this.y));

        // Угасание шлейфа
        for (let i = this.trail.length - 1; i >= 0; i--) {
          this.trail[i].alpha -= dt * 3.5;
          if (this.trail[i].alpha <= 0) this.trail.splice(i, 1);
        }
      }

      /**
       * ЛОГИКА ОРУЖИЯ (НАТЯЖЕНИЕ РОГАТКИ / БЛОК ПАЛКОЙ)
       */
      updateWeapon(dt, input, projectiles) {
        if (this.currentWeapon === WEAPONS.SLINGSHOT) {
          // Рогатка (Дальний бой)
          this.isBlocking = false;

          if (input.mouse.rmbDown) {
            // Натяжение рогатки (удержание ПКМ)
            this.chargeTime = Math.min(CONFIG.player.maxChargeTime, this.chargeTime + dt);
          } else if (input.mouse.rmbReleased) {
            // Отпускание ПКМ -> Создание снаряда (выстрел)
            const chargeProgress = this.chargeTime / CONFIG.player.maxChargeTime;
            const mult = CONFIG.player.minDmgMult + (CONFIG.player.maxDmgMult - CONFIG.player.minDmgMult) * chargeProgress;
            const finalDamage = Math.round(this.baseDamage * mult);

            // Создаем снаряд (летит по вектору к мыши на момент выстрела)
            projectiles.push(
              new Projectile(
                this.x,
                this.y,
                input.mouse.x,
                input.mouse.y,
                CONFIG.player.projectileSpeed,
                finalDamage
              )
            );

            // Сброс натяжения
            this.chargeTime = 0;
          }
        } else if (this.currentWeapon === WEAPONS.STICK) {
          // Палка (Ближний бой)
          this.chargeTime = 0;
          // Удержание ПКМ = блок
          this.isBlocking = input.mouse.rmbDown;
        }
      }

      switchWeapon(weaponId) {
        if (this.currentWeapon !== weaponId) {
          this.currentWeapon = weaponId;
          this.chargeTime = 0;
          this.isBlocking = false;
        }
      }

      processMovementInput(input) {
        let dx = 0, dy = 0;
        if (input.keys.has('KeyW') || input.keys.has('KeyЦ')) dy -= 1;
        if (input.keys.has('KeyS') || input.keys.has('KeyЫ')) dy += 1;
        if (input.keys.has('KeyA') || input.keys.has('KeyФ')) dx -= 1;
        if (input.keys.has('KeyD') || input.keys.has('KeyВ')) dx += 1;

        const length = Math.hypot(dx, dy);
        if (length > 0) {
          this.moveDir.x = dx / length;
          this.moveDir.y = dy / length;
          this.facingDir.x = this.moveDir.x;
          this.facingDir.y = this.moveDir.y;
        } else {
          this.moveDir.x = 0;
          this.moveDir.y = 0;
        }
      }

      canDash() {
        return !this.isDashing && this.dashCooldownTimer <= 0;
      }

      startDash() {
        this.isDashing = true;
        this.dashDurationTimer = CONFIG.player.dashDuration;
        this.dashCooldownTimer = CONFIG.player.dashCooldown;

        let dirX = this.moveDir.x || Math.cos(this.rotation);
        let dirY = this.moveDir.y || Math.sin(this.rotation);

        this.dashVelocity.x = dirX * CONFIG.player.dashSpeed;
        this.dashVelocity.y = dirY * CONFIG.player.dashSpeed;
      }

      draw(ctx, mouse) {
        // Отрисовка шлейфа
        this.trail.forEach(t => {
          ctx.beginPath();
          ctx.arc(t.x, t.y, t.radius * 0.9, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(99, 179, 237, ${t.alpha * 0.5})`;
          ctx.fill();
        });

        // Линия прицеливания для Рогатки
        if (this.currentWeapon === WEAPONS.SLINGSHOT) {
          ctx.save();
          ctx.beginPath();
          ctx.setLineDash([4, 6]);
          ctx.moveTo(this.x, this.y);
          ctx.lineTo(mouse.x, mouse.y);
          ctx.strokeStyle = this.chargeTime > 0 ? 'rgba(236, 201, 75, 0.7)' : 'rgba(255, 255, 255, 0.2)';
          ctx.lineWidth = 1.5;
          ctx.stroke();
          ctx.restore();
        }

        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);

        // Индикатор блока (энергетический щит перед персонажем)
        if (this.isBlocking) {
          ctx.beginPath();
          ctx.arc(0, 0, CONFIG.player.radius + 12, -Math.PI / 3, Math.PI / 3);
          ctx.strokeStyle = '#63b3ed';
          ctx.lineWidth = 5;
          ctx.shadowColor = '#3182ce';
          ctx.shadowBlur = 15;
          ctx.stroke();
        }

        // Внешнее свечение при натяжении рогатки
        if (this.chargeTime > 0) {
          const ratio = this.chargeTime / CONFIG.player.maxChargeTime;
          ctx.shadowColor = '#ecc94b';
          ctx.shadowBlur = 10 + ratio * 20;
        }

        // Свечение регенерации (зеленая аура вокруг игрока)
        if (this.regenDuration > 0) {
          ctx.shadowColor = '#48bb78';
          ctx.shadowBlur = 18;
        }

        // Тело игрока
        ctx.beginPath();
        ctx.arc(0, 0, CONFIG.player.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.isDashing ? '#90cdf4' : (this.isBlocking ? '#4299e1' : '#48bb78');
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();

        // Оружие в руках (нос/пушка/палка)
        ctx.beginPath();
        if (this.currentWeapon === WEAPONS.STICK) {
          // Палка в руках
          ctx.rect(CONFIG.player.radius - 2, -3, 16, 6);
          ctx.fillStyle = '#b7791f';
        } else {
          // Рогатка
          ctx.moveTo(CONFIG.player.radius - 2, -5);
          ctx.lineTo(CONFIG.player.radius + 10, 0);
          ctx.lineTo(CONFIG.player.radius - 2, 5);
          ctx.fillStyle = this.chargeTime > 0 ? '#ecc94b' : '#a0aec0';
        }
        ctx.fill();

        ctx.restore();
      }
    }

    // ==========================================
    // 3. ОБРАБОТЧИКИ ВВОДА (ВКЛЮЧАЯ МЫШЬ И CONTEXTMENU)
    // ==========================================
    class InputManager {
      constructor(canvas) {
        this.keys = new Set();
        this.dashRequested = false;

        // Позиция курсора и состояние ПКМ
        this.mouse = {
          x: canvas.width / 2,
          y: canvas.height / 2,
          rmbDown: false,
          rmbReleased: false,
        };

        // 🛑 ЖЕСТКОЕ ОТКЛЮЧЕНИЕ КОНТЕКСТНОГО МЕНЮ БРАУЗЕРА НА ПКМ
        window.addEventListener('contextmenu', (e) => {
          e.preventDefault();
        });

        // Отслеживание курсора относительно холста Canvas
        window.addEventListener('mousemove', (e) => {
          const rect = canvas.getBoundingClientRect();
          this.mouse.x = e.clientX - rect.left;
          this.mouse.y = e.clientY - rect.top;
        });

        // Нажатие кнопок мыши
        window.addEventListener('mousedown', (e) => {
          if (e.button === 2) { // 2 = Правая кнопка мыши (ПКМ)
            e.preventDefault();
            this.mouse.rmbDown = true;
          }
        });

        // Отпускание кнопок мыши
        window.addEventListener('mouseup', (e) => {
          if (e.button === 2) {
            e.preventDefault();
            this.mouse.rmbDown = false;
            this.mouse.rmbReleased = true; // флаг отпускания для разового выстрела
          }
        });

        // Клавиатура
        window.addEventListener('keydown', (e) => {
          this.keys.add(e.code);
          if (e.code === 'Space') {
            e.preventDefault();
            this.dashRequested = true;
          }
          if (e.code === 'KeyC') {
            this.spawnEnemyRequested = true;
          }
        });

        window.addEventListener('keyup', (e) => {
          this.keys.delete(e.code);
        });
      }

      consumeDash() {
        const req = this.dashRequested;
        this.dashRequested = false;
        return req;
      }

      consumeSpawnEnemy() {
        const req = this.spawnEnemyRequested;
        this.spawnEnemyRequested = false;
        return req;
      }

      consumeRmbRelease() {
        const rel = this.mouse.rmbReleased;
        this.mouse.rmbReleased = false;
        return rel;
      }
    }

    // ==========================================
    // 4. ГЛАВНЫЙ ИГРОВОЙ ДВИЖОК / ЦИКЛ (GAME ENGINE)
    // ==========================================
    class GameApp {
      constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');

        this.input = new InputManager(this.canvas);
        this.player = new PlayerController(this.canvas.width / 2, this.canvas.height / 2);
        this.projectiles = []; // активные снаряды
        this.potions = [];     // выпавшие зелья
        this.crates = [];      // разрушаемые ящики

        // Гусеницы и загрузка спрайтшита
        this.caterpillars = [];
        this.caterpillarImg = new Image();
        this.caterpillarImg.onerror = () => {
          this.caterpillarImg.src = 'assets/sprites/caterpillar.png';
        };
        this.caterpillarImg.src = 'public/assets/sprites/caterpillar.png';

        // Спавним стартовые ящики и врагов
        this.spawnInitialCrates();
        this.spawnCaterpillar(160, 200);
        this.spawnCaterpillar(800, 220);
        this.spawnCaterpillar(480, 420);

        // UI элементы
        this.hpFill = document.getElementById('hp-fill');
        this.hpValue = document.getElementById('hp-value');
        this.dashFill = document.getElementById('dash-fill');
        this.dashValue = document.getElementById('dash-value');

        this.lastTime = 0;
        requestAnimationFrame(this.loop.bind(this));
      }

      spawnCaterpillar(x, y) {
        const spawnX = x ?? (Math.random() > 0.5 ? 80 : this.canvas.width - 80);
        const spawnY = y ?? (Math.random() * (this.canvas.height - 140) + 70);
        this.caterpillars.push(new CaterpillarEnemy(spawnX, spawnY, this.caterpillarImg));
      }

      spawnInitialCrates() {
        const positions = [
          { x: 180, y: 140 }, { x: 220, y: 140 }, { x: 200, y: 180 },
          { x: 740, y: 140 }, { x: 780, y: 140 },
          { x: 200, y: 380 }, { x: 760, y: 380 },
          { x: 480, y: 120 }, { x: 480, y: 420 },
        ];
        positions.forEach(pos => this.crates.push(new Crate(pos.x, pos.y)));
      }

      loop(timestamp) {
        if (!this.lastTime) this.lastTime = timestamp;
        let dt = (timestamp - this.lastTime) / 1000;
        this.lastTime = timestamp;
        if (dt > 0.1) dt = 0.1;

        // Считываем ввод
        const frameInput = {
          keys: this.input.keys,
          dashRequested: this.input.consumeDash(),
          spawnEnemyRequested: this.input.consumeSpawnEnemy(),
          mouse: {
            x: this.input.mouse.x,
            y: this.input.mouse.y,
            rmbDown: this.input.mouse.rmbDown,
            rmbReleased: this.input.consumeRmbRelease(),
          }
        };

        // 1. UPDATE
        this.update(dt, frameInput);

        // 2. RENDER
        this.render();

        requestAnimationFrame(this.loop.bind(this));
      }

      update(dt, frameInput) {
        // Спавн гусеницы по клавише C
        if (frameInput.spawnEnemyRequested) {
          this.spawnCaterpillar();
        }

        // Обновление игрока
        this.player.update(dt, frameInput, this.projectiles, {
          width: this.canvas.width,
          height: this.canvas.height,
        });

        // Обновление гусениц
        for (let i = this.caterpillars.length - 1; i >= 0; i--) {
          const cat = this.caterpillars[i];
          cat.update(dt, { x: this.player.x, y: this.player.y });
          if (cat.isDead) {
            this.caterpillars.splice(i, 1);
          }
        }

        // Обновление снарядов
        for (let i = this.projectiles.length - 1; i >= 0; i--) {
          const p = this.projectiles[i];
          p.update(dt, { width: this.canvas.width, height: this.canvas.height });
          if (p.isDead) this.projectiles.splice(i, 1);
        }

        // Обновление зелий
        this.potions.forEach(pot => pot.update(dt));

        // ----------------------------------------------------
        // КОЛЛИЗИИ: СНАРЯДЫ РОГАТКИ vs ГУСЕНИЦЫ
        // ----------------------------------------------------
        for (let i = this.projectiles.length - 1; i >= 0; i--) {
          const p = this.projectiles[i];
          if (p.isDead) continue;

          for (let j = this.caterpillars.length - 1; j >= 0; j--) {
            const cat = this.caterpillars[j];
            if (cat.isDead) continue;

            const dist = Math.hypot(p.x - cat.x, p.y - cat.y);
            if (dist < p.radius + cat.radius) {
              p.isDead = true;
              cat.takeDamage(this.player.baseDamage);
              this.projectiles.splice(i, 1);
              break;
            }
          }
        }

        // ----------------------------------------------------
        // КОЛЛИЗИИ: СНАРЯДЫ РОГАТКИ vs ЯЩИКИ
        // ----------------------------------------------------
        for (let i = this.projectiles.length - 1; i >= 0; i--) {
          const p = this.projectiles[i];
          if (p.isDead) continue;

          for (let j = this.crates.length - 1; j >= 0; j--) {
            const crate = this.crates[j];
            if (crate.isDead) continue;

            const dist = Math.hypot(p.x - crate.x, p.y - crate.y);
            if (dist < p.radius + crate.radius) {
              p.isDead = true;
              crate.isDead = true;

              // РАНДОМАЙЗЕР: шанс ровно 15% на дроп Зелья
              if (Math.random() < 0.15) {
                this.potions.push(new Potion(crate.x, crate.y));
              }

              this.crates.splice(j, 1);
              this.projectiles.splice(i, 1);
              break;
            }
          }
        }

        // ----------------------------------------------------
        // КОЛЛИЗИИ: ИГРОК vs ЗЕЛЬЯ (ПОДБОР)
        // ----------------------------------------------------
        for (let i = this.potions.length - 1; i >= 0; i--) {
          const pot = this.potions[i];
          if (pot.isDead) continue;

          const dist = Math.hypot(this.player.x - pot.x, this.player.y - pot.y);
          if (dist < CONFIG.player.radius + pot.radius) {
            pot.isDead = true;
            this.potions.splice(i, 1);
            this.player.applyPotion();
          }
        }

        this.updateHUD();
      }

      updateHUD() {
        // HP
        const hpPercent = (this.player.hp / this.player.maxHp) * 100;
        this.hpFill.style.width = `${hpPercent}%`;

        let regenText = '';
        if (this.player.regenDuration > 0) {
          regenText = ` (+1/s: ${this.player.regenDuration.toFixed(1)}s)`;
          this.hpValue.style.color = '#68d391';
        } else {
          this.hpValue.style.color = '#e2e8f0';
        }
        this.hpValue.textContent = `${Math.round(this.player.hp)} / ${this.player.maxHp}${regenText}`;

        // Dash Cooldown
        if (this.player.dashCooldownTimer <= 0) {
          this.dashFill.style.width = '100%';
          this.dashValue.textContent = 'READY';
          this.dashValue.style.color = '#90cdf4';
        } else {
          const remaining = this.player.dashCooldownTimer;
          const total = CONFIG.player.dashCooldown;
          this.dashFill.style.width = `${((total - remaining) / total) * 100}%`;
          this.dashValue.textContent = `${remaining.toFixed(1)}s`;
          this.dashValue.style.color = '#e2e8f0';
        }
      }

      render() {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        this.drawGrid();

        // Отрисовка ящиков
        this.crates.forEach(c => c.draw(this.ctx));

        // Отрисовка выпавших зелий
        this.potions.forEach(pot => pot.draw(this.ctx));

        // Отрисовка гусениц
        this.caterpillars.forEach(cat => cat.draw(this.ctx));

        // Отрисовка снарядов
        this.projectiles.forEach(p => p.draw(this.ctx));

        // Отрисовка игрока
        this.player.draw(this.ctx, this.input.mouse);

        // Статус оружия и действий
        this.drawWeaponStatus();
      }

      drawWeaponStatus() {
        const weaponName = this.player.currentWeapon === WEAPONS.SLINGSHOT ? 'Рогатка (1)' : 'Палка (2)';
        let actionStatus = '';

        if (this.player.currentWeapon === WEAPONS.SLINGSHOT) {
          if (this.player.chargeTime > 0) {
            const ratio = this.player.chargeTime / CONFIG.player.maxChargeTime;
            const mult = CONFIG.player.minDmgMult + (CONFIG.player.maxDmgMult - CONFIG.player.minDmgMult) * ratio;
            const dmg = (this.player.baseDamage * mult).toFixed(1);
            actionStatus = `Натяжение: ${Math.round(ratio * 100)}% (Урон: ${dmg})`;
          } else {
            actionStatus = 'Зажмите ПКМ для натяжения (стреляйте по ящикам!)';
          }
        } else {
          actionStatus = this.player.isBlocking ? '🛡️ БЛОК АКТИВЕН' : 'Удерживайте ПКМ для блока';
        }

        this.ctx.save();
        this.ctx.font = 'bold 15px system-ui, sans-serif';
        this.ctx.fillStyle = '#f7fafc';
        this.ctx.fillText(`Оружие: ${weaponName}`, 20, this.canvas.height - 45);
        this.ctx.font = '13px system-ui, sans-serif';
        this.ctx.fillStyle = this.player.isBlocking ? '#63b3ed' : (this.player.chargeTime > 0 ? '#ecc94b' : '#a0aec0');
        this.ctx.fillText(actionStatus, 20, this.canvas.height - 24);
        this.ctx.restore();
      }

      drawGrid() {
        const { width, height } = this.canvas;
        const size = CONFIG.arena.gridSize;
        this.ctx.strokeStyle = CONFIG.arena.gridColor;
        this.ctx.lineWidth = 1;
        this.ctx.beginPath();
        for (let x = 0; x <= width; x += size) {
          this.ctx.moveTo(x, 0); this.ctx.lineTo(x, height);
        }
        for (let y = 0; y <= height; y += size) {
          this.ctx.moveTo(0, y); this.ctx.lineTo(width, y);
        }
        this.ctx.stroke();
      }
    }

    // Запуск приложения при загрузке страницы
    window.addEventListener('DOMContentLoaded', () => {
      new GameApp();
    });
  </script>
</body>
